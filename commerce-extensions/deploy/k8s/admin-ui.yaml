apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  namespace: commerce
  labels:
    app.kubernetes.io/name: admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-ui
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: admin-ui
          image: admin-ui:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CORE_URL
              value: http://core:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: admin-ui
  namespace: commerce
spec:
  selector:
    app.kubernetes.io/name: admin-ui
  ports:
    - name: http
      port: 80
      targetPort: http
