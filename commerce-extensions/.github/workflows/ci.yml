name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-java:
    name: Core (Java 21, JUnit 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  extension-rust:
    name: Extension (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/discount-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions/discount-rs
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  admin-ui-angular:
    name: Admin UI (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install kubernetes-validate
      - run: kubernetes-validate --strict -k 1.31.0 deploy/k8s/namespace.yaml deploy/k8s/core.yaml deploy/k8s/discount-extension.yaml deploy/k8s/admin-ui.yaml

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [core-java, extension-rust, admin-ui-angular]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t commerce-core:0.1.0 core
      - run: docker build -t discount-extension:0.1.0 extensions/discount-rs
      - run: docker build -t admin-ui:0.1.0 admin-ui
